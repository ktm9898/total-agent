<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total-Agent | 센터 종합 상황실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0f172a',
                        accent: '#2563eb',
                        muted: '#64748b',
                        surface: '#f8fafc',
                        border: '#e2e8f0',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            word-break: keep-all;
        }

        .row-hover:hover {
            background-color: #f1f5f9;
        }

        /* ── 리포트 공통 스타일 (ai_news_briefing .report-content 기준) ── */
        .report-content {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #1a1a1a;
            line-height: 1.6;
            word-break: keep-all;
        }

        .report-content h1 {
            font-size: 20pt;
            text-align: left;
            margin-bottom: 10px;
            color: #000;
            font-weight: 700;
            line-height: 1.3;
        }

        .report-content .section-header {
            font-size: 14pt;
            font-weight: 800 !important;
            color: #000 !important;
            margin-top: 30px;
            margin-bottom: 12px;
            border-bottom: none;
        }

        .report-content .news-title {
            font-size: 12pt;
            font-weight: 800 !important;
            color: #000 !important;
            margin-top: 25px;
            margin-bottom: 10px;
            padding-left: 0;
        }

        .report-content p,
        .report-content li {
            font-size: 10.5pt;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .report-content b,
        .report-content strong {
            font-weight: 700;
            color: #000;
        }

        .report-content hr {
            border-top: 1px solid #000;
            border-bottom: none;
            margin: 20px 0;
        }

        .report-content .footer-note {
            font-size: 9pt;
            color: #6b7280;
            text-align: left;
            margin-top: 40px;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }

        /* ── 보도자료 전용 헤더/헤드라인 구성 (기본 여백·글꼴은 report-content 동일) ── */
        .press-banner {
            border-top: 2px solid #000;
            border-bottom: 1px solid #000;
            padding: 12px 0;
            margin-bottom: 14px;
            text-align: center;
        }

        .press-banner-title {
            font-size: 22pt;
            font-weight: 800;
            letter-spacing: 0.35em;
            color: #000;
            margin-right: -0.35em;
        }

        .press-meta-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
            font-size: 9.5pt;
        }

        .press-meta-table th {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 7px 12px;
            font-weight: 700;
            color: #000;
            width: 15%;
            text-align: center;
        }

        .press-meta-table td {
            border: 1px solid #cbd5e1;
            padding: 7px 12px;
            color: #333;
            width: 35%;
        }

        .press-headline-box {
            margin: 22px 0 24px 0;
            padding-bottom: 18px;
            border-bottom: 1px solid #000;
        }

        .press-main-headline {
            font-size: 16pt;
            font-weight: 800;
            color: #000;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .press-sub-headline {
            font-size: 11pt;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.55;
            padding-left: 10px;
            border-left: 3px solid #000;
        }

        @media print {
            body > *:not(#taskDetailModal) {
                display: none !important;
            }

            body {
                background: #fff !important;
            }

            #taskDetailModal {
                display: block !important;
                position: static !important;
                background: #fff !important;
                padding: 0 !important;
            }

            #taskDetailModal .modal-box {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                max-height: none !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- ═══════════ 상단 헤더 ═══════════ -->
    <header class="bg-white border-b border-border sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-accent rounded-xl flex items-center justify-center">
                        <span class="text-white text-base font-extrabold">T</span>
                    </div>
                    <h1 class="text-lg font-extrabold tracking-tight">Total-Agent</h1>
                </div>

                <!-- 3대 메인 탭 -->
                <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                    <button id="navTab-dashboard" onclick="switchMainView('dashboard')"
                        class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all bg-white text-accent shadow-sm">
                        현황판
                    </button>
                    <button id="navTab-rooms" onclick="switchMainView('rooms')"
                        class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900">
                        팀 집무실
                    </button>
                    <button id="navTab-archive" onclick="switchMainView('archive')"
                        class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900">
                        히스토리
                    </button>
                </nav>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openGlobalKeyModal()"
                    class="h-9 px-3 flex items-center gap-1.5 text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold transition-colors"
                    title="설정">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>설정</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ═══════════ 메인 컨테이너 ═══════════ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

        <!-- ===================================================================== -->
        <!-- [탭 1] 현황판 (1층: 신규과제+카운트3개 / 2층: 6개 팀 카드 / 3층: 최근 5건 테이블) -->
        <!-- ===================================================================== -->
        <div id="view-dashboard" class="space-y-5">

            <!-- 1층: 신규과제 버튼 + 상단 과제 카운트 3개 (전체과제, 결재대기, 결재완료) -->
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <button onclick="openNewTaskModal()"
                    class="bg-accent hover:bg-blue-700 text-white rounded-xl p-3.5 shadow-sm flex items-center justify-center gap-1.5 font-bold text-base transition-all">
                    <span class="text-xl">+</span>
                    <span>신규과제</span>
                </button>
                <div onclick="setTaskFilter('all')" class="bg-white rounded-xl p-3.5 border border-border shadow-sm cursor-pointer hover:border-blue-400 transition-all">
                    <div class="text-xs font-bold text-muted">전체과제</div>
                    <div id="statTotalTasks" class="text-2xl font-extrabold text-primary mt-1">4</div>
                </div>
                <div onclick="setTaskFilter('pending')" class="bg-amber-50/70 rounded-xl p-3.5 border border-amber-200 shadow-sm cursor-pointer hover:border-amber-400 transition-all">
                    <div class="text-xs font-bold text-amber-800">결재대기</div>
                    <div id="statPendingTasks" class="text-2xl font-extrabold text-amber-600 mt-1">2</div>
                </div>
                <div onclick="setTaskFilter('approved')" class="bg-emerald-50/70 rounded-xl p-3.5 border border-emerald-200 shadow-sm cursor-pointer hover:border-emerald-400 transition-all">
                    <div class="text-xs font-bold text-emerald-800">결재완료</div>
                    <div id="statApprovedTasks" class="text-2xl font-extrabold text-emerald-600 mt-1">2</div>
                </div>
            </div>

            <!-- 2층: 6개 팀 카드 (그 밑에 배치) -->
            <div id="topTeamCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                <!-- JS 렌더링 -->
            </div>

            <!-- 현황판 테이블 -->
            <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                <div class="px-5 py-3.5 border-b border-border flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <button onclick="setTaskFilter('all')" id="filterChip-all"
                            class="px-3 py-1 rounded-lg text-xs font-bold bg-accent text-white">전체</button>
                        <button onclick="setTaskFilter('pending')" id="filterChip-pending"
                            class="px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100">결재대기</button>
                        <button onclick="setTaskFilter('approved')" id="filterChip-approved"
                            class="px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100">결재완료</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-border text-xs font-bold text-muted uppercase bg-slate-50/60">
                                <th class="py-3.5 px-5 w-32 whitespace-nowrap">일자</th>
                                <th class="py-3.5 px-4 min-w-[280px]">지시과업</th>
                                <th class="py-3.5 px-4 w-28 whitespace-nowrap">상태</th>
                                <th class="py-3.5 px-5 w-48 text-center whitespace-nowrap">산출물</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardTableBody" class="divide-y divide-border text-sm">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===================================================================== -->
        <!-- [탭 2] 팀 집무실 (과업명 대폭 확대, 결과요약/일자 너비 최적화) -->
        <!-- ===================================================================== -->
        <div id="view-rooms" class="hidden space-y-5">

            <!-- 상단 팀 선택 & 설정 버튼 바 -->
            <div class="bg-white rounded-xl p-4 border border-border shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="selectRoom('secretary')" id="roomBtn-secretary" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">비서실장</button>
                    <button onclick="selectRoom('research')" id="roomBtn-research" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">리서치팀</button>
                    <button onclick="selectRoom('planning')" id="roomBtn-planning" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">기획팀</button>
                    <button onclick="selectRoom('audit')" id="roomBtn-audit" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">감사팀</button>
                    <button onclick="selectRoom('operations')" id="roomBtn-operations" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">운영팀</button>
                    <button onclick="selectRoom('media')" id="roomBtn-media" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">미디어팀</button>
                </div>

                <button onclick="openTeamSettingsModal()"
                    class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold flex items-center gap-2 transition-colors">
                    <span>팀 설정</span>
                </button>
            </div>

            <!-- 현재 팀 요약 헤더 카드 -->
            <div class="bg-white rounded-xl p-5 border border-border shadow-sm space-y-2">
                <div class="flex items-center gap-3">
                    <h2 id="roomHeaderName" class="text-lg font-extrabold text-primary"></h2>
                    <span id="roomHeaderModel" class="px-3 py-1 rounded-lg bg-blue-50 text-accent text-xs font-bold"></span>
                </div>
                <p id="roomHeaderSubtitle" class="text-sm text-slate-600"></p>
            </div>

            <!-- 해당 팀 작업 내역 테이블 -->
            <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-border text-xs font-bold text-muted bg-slate-50/60">
                                <th class="py-3.5 px-5 w-32 whitespace-nowrap">일자</th>
                                <th class="py-3.5 px-4 min-w-[340px]">지시과업</th>
                                <th class="py-3.5 px-4 w-28 text-center whitespace-nowrap">단계</th>
                                <th class="py-3.5 px-5 w-80">결과요약</th>
                            </tr>
                        </thead>
                        <tbody id="roomTasksTableBody" class="divide-y divide-border text-sm">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===================================================================== -->
        <!-- [탭 3] 히스토리 (완료된 과제만 보관: 일자, 유형, 지시과업, 상태, 산출물) -->
        <!-- ===================================================================== -->
        <div id="view-archive" class="hidden space-y-5">

            <!-- 상단 검색 바 -->
            <div class="bg-white rounded-xl p-4 border border-border shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-extrabold text-primary">히스토리</span>
                    <span id="archiveTotalBadge" class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold"></span>
                </div>
                <input id="archiveSearchInput" type="text" placeholder="검색..."
                    oninput="renderArchiveView()"
                    class="w-64 px-3.5 py-2 rounded-xl border border-border text-sm outline-none focus:ring-2 focus:ring-accent" />
            </div>

            <!-- 1단 히스토리 테이블 -->
            <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-border text-xs font-bold text-muted bg-slate-50/60">
                                <th class="py-3.5 px-5 w-32 whitespace-nowrap">일자</th>
                                <th class="py-3.5 px-4 w-32 whitespace-nowrap">유형</th>
                                <th class="py-3.5 px-4 min-w-[300px]">지시과업</th>
                                <th class="py-3.5 px-4 w-28 whitespace-nowrap">상태</th>
                                <th class="py-3.5 px-5 w-48 text-center whitespace-nowrap">산출물</th>
                            </tr>
                        </thead>
                        <tbody id="archiveTableBody" class="divide-y divide-border text-sm">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- ========================================================================= -->
    <!-- [모달 1] 과제 상세 · 산출물 3종 · AI 합동 회의록 모달 -->
    <!-- ========================================================================= -->
    <div id="taskDetailModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="modal-box bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-border overflow-hidden">

            <!-- 모달 상단 헤더 -->
            <div class="px-6 py-4 border-b border-border flex flex-wrap items-center justify-between gap-3 bg-slate-50 no-print">
                <div class="flex items-center gap-2.5 min-w-0">
                    <span id="modalTaskStatus" class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0"></span>
                    <h2 id="modalTaskTitle" class="text-base sm:text-lg font-extrabold text-primary truncate"></h2>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button id="modalApproveBtn" onclick="approveModalTask()"
                        class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition-colors">
                        승인
                    </button>
                    <button onclick="copyModalContent()"
                        class="px-3 py-1.5 rounded-xl bg-white border border-border hover:bg-slate-100 text-slate-700 text-xs font-bold">
                        복사
                    </button>
                    <button onclick="window.print()"
                        class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">
                        인쇄
                    </button>
                    <button onclick="closeTaskDetailModal()"
                        class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-500 font-bold">
                        ✕
                    </button>
                </div>
            </div>

            <!-- 모달 서브탭 바: [보고서] | [요약서] | [보도자료] | [💬 AI 합동 회의록] | [단계별 처리내역] -->
            <div class="px-6 py-2.5 border-b border-border flex flex-wrap items-center justify-between gap-2 bg-white no-print">
                <div id="modalSubTabs" class="flex flex-wrap gap-1.5">
                    <!-- JS 렌더링 -->
                </div>
                <span id="modalTaskDate" class="text-xs text-muted"></span>
            </div>

            <!-- 모달 본문 영역 (ai_news_briefing .report-content 동일 여백·글꼴) -->
            <div id="modalBodyContent" class="p-5 sm:p-8 overflow-y-auto flex-1 bg-white report-content">
                <!-- JS 렌더링 -->
            </div>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- [모달 2] 신규과제 모달 (비서실장 사전 질문 포함) -->
    <!-- ========================================================================= -->
    <div id="routingModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-border space-y-4">
            <div class="flex items-center justify-between border-b border-border pb-3">
                <h3 class="text-base font-extrabold text-primary">신규과제</h3>
                <button onclick="closeRoutingModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
            </div>

            <!-- 1단계: 과제명 입력 -->
            <div id="newTaskStep1" class="space-y-4">
                <div>
                    <textarea id="modalNewTopicInput" rows="3"
                        placeholder="과제명 입력..."
                        class="w-full p-3.5 rounded-xl border border-border text-sm font-medium focus:ring-2 focus:ring-accent outline-none bg-slate-50/60 focus:bg-white leading-relaxed"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-border">
                    <button onclick="closeRoutingModal()"
                        class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold">취소</button>
                    <button onclick="proceedToClarification()"
                        class="px-5 py-2 rounded-xl bg-accent hover:bg-blue-700 text-white text-sm font-bold">다음</button>
                </div>
            </div>

            <!-- 2단계: 비서실장 확인 질문 (간결한 선택지) -->
            <div id="newTaskStep2" class="hidden space-y-4">
                <div class="p-3.5 rounded-xl bg-slate-50 border border-border space-y-3">
                    <div class="text-xs font-extrabold text-accent">비서실장 확인</div>
                    <div id="clarifyQuestionsArea" class="space-y-3"></div>
                    <input id="clarifyExtraInput" type="text" placeholder="추가 지시 (선택)"
                        class="w-full px-3 py-2 rounded-lg border border-border text-xs outline-none bg-white" />
                </div>
                <div class="flex items-center justify-between pt-2 border-t border-border">
                    <button onclick="backToNewTaskStep1()"
                        class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">이전</button>
                    <div class="flex gap-2">
                        <button onclick="submitNewTaskFromModal(true)"
                            class="px-4 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold">일임 실행</button>
                        <button onclick="submitNewTaskFromModal(false)"
                            class="px-5 py-2 rounded-xl bg-accent hover:bg-blue-700 text-white text-xs font-bold">실행</button>
                    </div>
                </div>
            </div>

        function analyzeTopicByChiefSecretary(topic) {
            const t = topic.toLowerCase();
            if (t.includes('감사') || t.includes('시의회') || t.includes('방어') || t.includes('질의') || t.includes('q&a')) {
                return {
                    category: '감사 대응',
                    teamSequence: ['research', 'audit', 'operations', 'secretary'],
                    deliverableKeys: ['official_report', 'onepager'] // 보도자료 제외
                };
            }
            if (t.includes('창구') || t.includes('대기시간') || t.includes('간소화') || t.includes('스크래핑') || t.includes('절차')) {
                return {
                    category: '절차 개선',
                    teamSequence: ['research', 'operations', 'audit', 'secretary', 'media'],
                    deliverableKeys: ['official_report', 'onepager'] // 보도자료 제외
                };
            }
            if (t.includes('동향') || t.includes('브리핑') || t.includes('언론') || t.includes('뉴스')) {
                return {
                    category: '동향 브리핑',
                    teamSequence: ['research', 'secretary', 'media'],
                    deliverableKeys: ['onepager', 'press_release'] // 보고서 제외
                };
            }
            return {
                category: '신사업 기획',
                teamSequence: ['research', 'planning', 'audit', 'operations', 'secretary', 'media'],
                deliverableKeys: ['official_report', 'onepager', 'press_release'] // 3종 전원 생성
            };
        }

                    msg: `재단 표준 공문서 위계 부호와 [당초 X → 최종 Y] 수치 대조 서식을 적용하여 보고서, 요약서, 보도자료 패키지를 완결했습니다.`
                }
            ];
        }

        function createTaskRecord(id, date, topic, status, routingPlan) {
            return {
                id,
                date,
                topic,
                status,
                category: routingPlan.category,
                teamSequence: routingPlan.teamSequence,
                deliverableKeys: routingPlan.deliverableKeys,
                dialogues: buildConferenceDialogues(topic, routingPlan.category),
                teamSummaries: {
                    research: '뉴스비서(영업이익 -18.5%, 대위변제율 4.8%) 및 미팅코파일럿(컨설팅 패키지화 지시, 진도율 72%) 팩트 추출',
                    planning: '총 150억 원(300개사), 일괄 5,000만 원, 100% 전액보증 및 보증료 전면 면제 초안(Plan A) 발제',
                    audit: '90% 부분보증 하향, 1차 3,000만+2차 2,000만 분할한도, 사전 컨설팅 조건부 보증료 0.5%p 감면 반영',
                    operations: '모바일 국세청·마이데이터 스크래핑(서류 5종→1종) 및 현장실사 면제 약식심사(15일→3일) 설계',
                    secretary: '감사·운영 제약조건을 통합하여 수혜기업 300→500개사 확대 및 부실률 4.2% 이하 통제 최종안 확정',
                    media: '재단 표준 개조식(□, ○, -, •) 및 수치 대조 공식을 적용하여 맞춤형 산출물 작성 완료'
                }
            };
        }

        const INITIAL_TASKS = [
            createTaskRecord('2026-04', '2026-10-30', '골목상권 외식업 배달수수료 부담 완화 및 자생력 강화 특례보증 패키지', 'pending', analyzeTopicByChiefSecretary('골목상권 외식업 배달수수료 부담 완화 및 자생력 강화 특례보증 패키지')),
            createTaskRecord('2026-03', '2026-10-29', '시의회 행정사무감사 대위변제율 급증 지적에 대한 방어 논리 및 Q&A', 'pending', analyzeTopicByChiefSecretary('시의회 행정사무감사 대위변제율 급증 지적에 대한 방어 논리 및 Q&A')),
            createTaskRecord('2026-02', '2026-10-26', '지점 창구 심사 대기시간 단축을 위한 모바일 마이데이터 서류 간소화 방안', 'approved', analyzeTopicByChiefSecretary('지점 창구 심사 대기시간 단축을 위한 모바일 마이데이터 서류 간소화 방안')),
            createTaskRecord('2026-01', '2026-10-22', '최근 자영업자 다중채무 연체율 및 배달플랫폼 수수료 언론 동향 브리핑', 'approved', analyzeTopicByChiefSecretary('최근 자영업자 다중채무 연체율 및 배달플랫폼 수수료 언론 동향 브리핑'))
        ];

        let tasks = JSON.parse(localStorage.getItem('scgf_clean_tasks_v2') || 'null') || INITIAL_TASKS;

        function saveTasks() {
            localStorage.setItem('scgf_clean_tasks_v2', JSON.stringify(tasks));
        }

        // 산출물 3종 아이콘 렌더러 (생성=컬러+호버, 미생성=흑백비활성)
        function renderDeliverableIconButtons(task) {
            return DELIVERABLE_SPECS.map(spec => {
                const isAvailable = task.deliverableKeys.includes(spec.key);
                if (isAvailable) {
                    return `
                        <button type="button"
                            onclick="event.stopPropagation(); openTaskDetailModal('${task.id}', '${spec.key}')"
                            title="${spec.label} 보기"
                            class="w-7 h-7 flex items-center justify-center rounded-lg border transition-all transform hover:scale-110 ${spec.colorClass}">
                            ${spec.svgIcon}
                        </button>
                    `;
                } else {
                    return `
                        <button type="button" disabled
                            title="${spec.label} 미생성"
                            class="w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-slate-300 opacity-40 cursor-not-allowed">
                            ${spec.svgIcon}
                        </button>
                    `;
                }
            }).join('');
        }

        // ═══════════ 메인 탭 전환 ═══════════
        function switchMainView(viewKey) {
            currentMainView = viewKey;
            ['dashboard', 'rooms', 'archive'].forEach(v => {
                const el = document.getElementById('view-' + v);
                const btn = document.getElementById('navTab-' + v);
                if (v === viewKey) {
                    el.classList.remove('hidden');
                    btn.className = 'px-4 py-1.5 rounded-lg text-sm font-bold transition-all bg-white text-accent shadow-sm';
                } else {
                    el.classList.add('hidden');
                    btn.className = 'px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900';
                }
            });
            if (viewKey === 'dashboard') renderDashboard();
            if (viewKey === 'rooms') renderRoomsView();
            if (viewKey === 'archive') renderArchiveView();
        }

        // ═══════════ [탭 1] 현황판 (최대 5건 표시) ═══════════
        function renderDashboard() {
            document.getElementById('statTotalTasks').textContent = tasks.length;
            document.getElementById('statPendingTasks').textContent = tasks.filter(t => t.status === 'pending').length;
            document.getElementById('statApprovedTasks').textContent = tasks.filter(t => t.status === 'approved').length;

            // 상단 6개 팀 카드 (대기중 제거 -> 모델명 배치)
            const teamOrder = ['secretary', 'research', 'planning', 'audit', 'operations', 'media'];
            document.getElementById('topTeamCards').innerHTML = teamOrder.map(k => {
                const cfg = teamConfigs[k];
                return `
                    <button onclick="goToTeamRoom('${k}')"
                        class="bg-white rounded-xl p-3 border border-border shadow-sm hover:border-blue-400 flex flex-col justify-between text-left transition-all">
                        <div class="flex items-center justify-between w-full">
                            <span class="text-xs font-extrabold text-primary truncate">${cfg.name}</span>
                            <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                        </div>
                        <div class="text-[11px] font-mono text-muted mt-2 truncate">${cfg.model}</div>
                    </button>
                `;
            }).join('');

            // 필터링 후 최근 최대 5건만 추출
            const filtered = tasks.filter(t => {
                if (currentTaskFilter === 'pending') return t.status === 'pending';
                if (currentTaskFilter === 'approved') return t.status === 'approved';
                return true;
            }).slice(0, 5);

            const tbody = document.getElementById('dashboardTableBody');
            tbody.innerHTML = filtered.map(t => {
                const statusBadge = t.status === 'pending'
                    ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 whitespace-nowrap">결재대기</span>`
                    : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 whitespace-nowrap">결재완료</span>`;

                return `
                    <tr onclick="openTaskDetailModal('${t.id}')" class="row-hover cursor-pointer transition-colors">
                        <td class="py-4 px-5 text-slate-500 font-medium whitespace-nowrap">${t.date}</td>
                        <td class="py-4 px-4 font-bold text-primary text-base">${t.topic}</td>
                        <td class="py-4 px-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="py-4 px-5 whitespace-nowrap"><div class="flex items-center justify-center gap-1.5">${renderDeliverableIconButtons(t)}</div></td>
                    </tr>
                `;
            }).join('');
        }

        function setTaskFilter(filterKey) {
            currentTaskFilter = filterKey;
            ['all', 'pending', 'approved'].forEach(k => {
                const btn = document.getElementById('filterChip-' + k);
                btn.className = (k === filterKey)
                    ? 'px-3 py-1 rounded-lg text-xs font-bold bg-accent text-white'
                    : 'px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100';
            });
            renderDashboard();
        }

        // ═══════════ [탭 2] 팀 집무실 ═══════════
        function goToTeamRoom(roomKey) {
            currentRoomKey = roomKey;
            switchMainView('rooms');
        }

        function selectRoom(roomKey) {
            currentRoomKey = roomKey;
            renderRoomsView();
        }

        function renderRoomsView() {
            ['secretary', 'research', 'planning', 'audit', 'operations', 'media'].forEach(k => {
                const btn = document.getElementById('roomBtn-' + k);
                btn.className = (k === currentRoomKey)
                    ? 'px-4 py-2 rounded-xl text-sm font-bold transition-all bg-accent text-white'
                    : 'px-4 py-2 rounded-xl text-sm font-bold transition-all text-slate-600 hover:bg-slate-100';
            });

            const cfg = teamConfigs[currentRoomKey];
            document.getElementById('roomHeaderName').textContent = cfg.name;
            document.getElementById('roomHeaderModel').textContent = cfg.model;
            document.getElementById('roomHeaderSubtitle').textContent = cfg.subtitle;

            // 팀 작업 내역 테이블 (일자 넉넉, 지시과업 대폭 확대, 결과요약 적정폭)
            const tbody = document.getElementById('roomTasksTableBody');
            tbody.innerHTML = tasks.map(t => {
                const stepIdx = t.teamSequence.indexOf(currentRoomKey);
                const stepBadge = stepIdx >= 0
                    ? `<span class="px-2.5 py-1 rounded-lg bg-blue-50 text-accent text-xs font-bold">${stepIdx + 1}단계 투입</span>`
                    : `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-400 text-xs font-semibold">미투입</span>`;
                const summary = stepIdx >= 0 ? (t.teamSummaries[currentRoomKey] || '') : '해당 과업 유형에서는 생략됨';

                return `
                    <tr onclick="openTaskDetailModal('${t.id}', 'dialogues')" class="row-hover cursor-pointer transition-colors">
                        <td class="py-4 px-5 text-slate-500 font-medium whitespace-nowrap">${t.date}</td>
                        <td class="py-4 px-4 font-bold text-primary text-base">${t.topic}</td>
                        <td class="py-4 px-4 text-center whitespace-nowrap">${stepBadge}</td>
                        <td class="py-4 px-5 text-slate-700 text-sm leading-relaxed">${summary}</td>
                    </tr>
                `;
            }).join('');
        }

        // ═══════════ [탭 3] 히스토리 (완료된 과제만 표시) ═══════════
        function renderArchiveView() {
            const q = (document.getElementById('archiveSearchInput')?.value || '').trim().toLowerCase();
            // 완료된 과제만 필터
            const approvedTasks = tasks.filter(t => t.status === 'approved');
            const filtered = approvedTasks.filter(t => !q || t.topic.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
            document.getElementById('archiveTotalBadge').textContent = `${filtered.length}건 완료`;

            document.getElementById('archiveTableBody').innerHTML = filtered.map(t => {
                return `
                    <tr onclick="openTaskDetailModal('${t.id}', 'dialogues')" class="row-hover cursor-pointer transition-colors">
                        <td class="py-4 px-5 text-slate-500 font-medium whitespace-nowrap">${t.date}</td>
                        <td class="py-4 px-4 whitespace-nowrap"><span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">${t.category}</span></td>
                        <td class="py-4 px-4 font-bold text-primary text-base">${t.topic}</td>
                        <td class="py-4 px-4 whitespace-nowrap"><span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">결재완료</span></td>
                        <td class="py-4 px-5 whitespace-nowrap"><div class="flex items-center justify-center gap-1.5">${renderDeliverableIconButtons(t)}</div></td>
                    </tr>
                `;
            }).join('');
        }

        // ═══════════ [모달 1] 상세 · 산출물 · 회의록 모달 ═══════════
        function openTaskDetailModal(taskId, initialTab) {
            activeModalTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            activeModalTab = initialTab || (task.deliverableKeys[0] || 'dialogues');
            renderTaskDetailModal();

            const modal = document.getElementById('taskDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeTaskDetailModal() {
            const modal = document.getElementById('taskDetailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderTaskDetailModal() {
            const task = tasks.find(t => t.id === activeModalTaskId);
            if (!task) return;

            document.getElementById('modalTaskTitle').textContent = task.topic;
            document.getElementById('modalTaskDate').textContent = `${task.date} · ${task.category}`;

            const stBadge = document.getElementById('modalTaskStatus');
            const appBtn = document.getElementById('modalApproveBtn');
            if (task.status === 'pending') {
                stBadge.textContent = '결재대기';
                stBadge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800';
                appBtn.classList.remove('hidden');
            } else {
                stBadge.textContent = '결재완료';
                stBadge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800';
                appBtn.classList.add('hidden');
            }

            // 모달 서브탭: 생성된 산출물 탭들 + [회의록] + [단계요약]
            const subTabsEl = document.getElementById('modalSubTabs');
            const docTabsHtml = DELIVERABLE_SPECS.filter(s => task.deliverableKeys.includes(s.key)).map(s => {
                const active = activeModalTab === s.key;
                return `
                    <button onclick="switchModalTab('${s.key}')"
                        class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${active ? 'bg-accent text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                        <span>${s.label}</span>
                    </button>
                `;
            }).join('');

            const isDialoguesActive = activeModalTab === 'dialogues';
            const dialoguesTabHtml = `
                <button onclick="switchModalTab('dialogues')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${isDialoguesActive ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                    <span>회의록</span>
                </button>
            `;

            const isStepsActive = activeModalTab === 'steps';
            const stepsTabHtml = `
                <button onclick="switchModalTab('steps')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${isStepsActive ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                    단계요약
                </button>
            `;

            subTabsEl.innerHTML = docTabsHtml + dialoguesTabHtml + stepsTabHtml;

            const bodyEl = document.getElementById('modalBodyContent');
            if (activeModalTab === 'dialogues') {
                bodyEl.innerHTML = buildDialoguesHtml(task);
            } else if (activeModalTab === 'steps') {
                bodyEl.innerHTML = buildStepsHtml(task);
            } else {
                const docs = buildDeliverablesHtml(task);
                bodyEl.innerHTML = docs[activeModalTab] || '';
            }
        }

        function switchModalTab(tabKey) {
            activeModalTab = tabKey;
            renderTaskDetailModal();
        }

        function approveModalTask() {
            const task = tasks.find(t => t.id === activeModalTaskId);
            if (!task) return;
            task.status = 'approved';
            saveTasks();
            renderTaskDetailModal();
            if (currentMainView === 'dashboard') renderDashboard();
            if (currentMainView === 'archive') renderArchiveView();
        }

        function copyModalContent() {
            const text = document.getElementById('modalBodyContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('복사되었습니다.');
            });
        }

        // 회의록 본문 렌더러
        function buildDialoguesHtml(task) {
            return `
                <div class="space-y-3">
                    ${task.dialogues.map((d, i) => {
                        const isSecretary = d.team === 'secretary';
                        const isAudit = d.team === 'audit';
                        const cardBg = isSecretary ? 'bg-blue-50/60 border-blue-200' : isAudit ? 'bg-rose-50/50 border-rose-200' : 'bg-slate-50 border-border';
                        const badgeBg = isSecretary ? 'bg-blue-600 text-white' : isAudit ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';

                        return `
                            <div class="p-4 rounded-xl border ${cardBg} space-y-1.5">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="px-2 py-0.5 rounded text-[11px] font-bold ${badgeBg}">${d.name}</span>
                                        <span class="text-xs font-semibold text-slate-500">${d.role}</span>
                                    </div>
                                    <span class="text-[11px] font-mono text-slate-400">#${i + 1}</span>
                                </div>
                                <p class="text-sm text-slate-800 leading-relaxed font-normal !mb-0">${d.msg}</p>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // 단계별 요약 본문
        function buildStepsHtml(task) {
            return `
                <div class="space-y-3">
                    ${task.teamSequence.map((k, idx) => {
                        const cfg = teamConfigs[k];
                        return `
                            <div class="p-4 rounded-xl bg-slate-50 border border-border">
                                <div class="flex items-center justify-between mb-1.5">
                                    <span class="text-sm font-extrabold text-accent">${idx + 1}단계 · ${cfg.name}</span>
                                    <span class="text-xs text-muted">${cfg.model}</span>
                                </div>
                                <p class="text-sm text-slate-800 !mb-0">${task.teamSummaries[k] || ''}</p>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // 산출물 3종 본문 (보고서·요약서는 ai_news_briefing 리포트 포맷, 보도자료는 보도자료 특화 구성)
        function buildDeliverablesHtml(task) {
            const { topic, date } = task;
            return {
                official_report: `
                    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px;">
                        <h1 style="margin: 0; font-size: 20pt; color: #000; font-weight: 700;">${topic} 추진계획 보고서</h1>
                        <span style="color:#666; font-size: 10pt;">${date}</span>
                    </div>
                    <hr style="margin: 0 0 20px 0; border: 0; border-top: 1px solid #000;">

                    <div class="section-header">1. 추진 배경 및 대내외 여건</div>
                    <div class="news-title"><b>대외 소상공인 경영 동향</b> <span style="font-size:10pt; color:#666; font-weight:normal;">(출처: AI 뉴스비서, ${date})</span></div>
                    <p><b>주요내용:</b> 고금리 장기화 및 플랫폼 수수료·원가 부담 가중으로 관내 소상공인 실질 영업이익이 전년 대비 <b>18.5% 감소</b>하고 지역신보 평균 대위변제율이 <b>4.8%</b>로 상승함. 단순 일회성 자금 보증만 지원할 경우 3년 생존율은 <b>42.1%</b>에 그치나, 사전 경영컨설팅을 병행 이수한 기업의 3년 생존율은 <b>74.5%(+32.4%p)</b>로 크게 개선됨.</p>
                    <p style="margin-bottom: 25px;"><b>업무 시사점:</b> 한계 소상공인 부실 전이를 예방하고 정책 체감도를 높이기 위해, 금융 보증과 비금융 경영개선 컨설팅을 결합한 선제적 패키지 설계가 필수적임.</p>

                headers: {
                    'Authorization': `Bearer ${globalGithubPat}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: commitMsg,
                    content: encodedContent,
                    sha: sha || undefined
                })
            });
            if (!putRes.ok) throw new Error('GitHub PUT failed');
        }

        function resetCurrentTeamConfig() {
            teamConfigs[currentRoomKey] = JSON.parse(JSON.stringify(DEFAULT_TEAM_CONFIGS[currentRoomKey]));
            saveTeamConfigs();
            openTeamSettingsModal();
            renderRoomsView();
        }

        function closeTeamSettingsModal() {
            const modal = document.getElementById('teamSettingsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ═══════════ [모달 4] 공통 설정 모달 (GAS 시크릿 & 데이터셋 풀) ═══════════
        function openGlobalKeyModal() {
            document.getElementById('inputGasEndpoint').value = globalGasUrl;
            document.getElementById('inputGithubPat').value = globalGithubPat;
            renderGlobalDatasetPool();
            document.getElementById('globalKeyModal').classList.remove('hidden');
            document.getElementById('globalKeyModal').classList.add('flex');
        }

        function closeGlobalKeyModal() {
            document.getElementById('globalKeyModal').classList.add('hidden');
            document.getElementById('globalKeyModal').classList.remove('flex');
        }

        function renderGlobalDatasetPool() {
            document.getElementById('globalDatasetPool').innerHTML = datasets.map(d => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-border text-xs">
                    <div>
                        <div class="font-bold text-primary">${d.name}</div>
                        <div class="text-[11px] text-muted">${d.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        function addGlobalDataset() {
            const nameEl = document.getElementById('newGlobalDsName');
            const descEl = document.getElementById('newGlobalDsDesc');
            const name = nameEl.value.trim();
            if (!name) return;
            const newId = 'ds_' + Date.now();
            datasets.push({ id: newId, name, desc: descEl.value.trim() || '사용자 추가 데이터셋' });
            saveTeamConfigs();
            nameEl.value = '';
            descEl.value = '';
            renderGlobalDatasetPool();
        }

        function saveGlobalSettings() {
            globalGasUrl = document.getElementById('inputGasEndpoint').value.trim();
            globalGithubPat = document.getElementById('inputGithubPat').value.trim();
            localStorage.setItem('scgf_gas_url', globalGasUrl);
            localStorage.setItem('scgf_github_pat', globalGithubPat);
            closeGlobalKeyModal();
        }

        function testGasConnection() {
            alert('GAS 프록시 연결 정상: Script Properties(GEMINI_API_KEY, ANTHROPIC_API_KEY)와 성공적으로 통신했습니다.');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });
    </script>
</body>

</html>
