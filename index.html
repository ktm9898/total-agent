<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total-Agent | 센터 종합 상황실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0f172a',
                        accent: '#2563eb',
                        muted: '#64748b',
                        surface: '#f8fafc',
                        border: '#e2e8f0',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            word-break: keep-all;
        }

        .row-hover:hover {
            background-color: #f1f5f9;
        }

        .doc-viewer h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
            border-bottom: 2px solid #0f172a;
            padding-bottom: 10px;
            margin-bottom: 18px;
        }

        .doc-viewer h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1e3a8a;
            margin-top: 22px;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
        }

        .doc-viewer p,
        .doc-viewer li {
            font-size: 0.95rem;
            line-height: 1.75;
            color: #1e293b;
        }

        .doc-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 0.9rem;
        }

        .doc-table th {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            font-weight: 700;
            text-align: left;
            color: #0f172a;
        }

        .doc-table td {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            vertical-align: top;
            line-height: 1.6;
        }

        @media print {
            body > *:not(#taskDetailModal) {
                display: none !important;
            }

            body {
                background: #fff !important;
            }

            #taskDetailModal {
                display: block !important;
                position: static !important;
                background: #fff !important;
                padding: 0 !important;
            }

            #taskDetailModal .modal-box {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                max-height: none !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- ═══════════ 상단 헤더 (뉴스비서 스타일 화이트 클린 헤더) ═══════════ -->
    <header class="bg-white border-b border-border sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-accent rounded-xl flex items-center justify-center">
                        <span class="text-white text-base font-extrabold">T</span>
                    </div>
                    <h1 class="text-lg font-extrabold tracking-tight">Total-Agent</h1>
                </div>

                <!-- 3대 메인 탭 (간결한 명칭) -->
                <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                    <button id="navTab-dashboard" onclick="switchMainView('dashboard')"
                        class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all bg-white text-accent shadow-sm">
                        현황판
                    </button>
                    <button id="navTab-rooms" onclick="switchMainView('rooms')"
                        class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900">
                        팀 집무실
                    </button>
                    <button id="navTab-archive" onclick="switchMainView('archive')"
                        class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900">
                        히스토리
                    </button>
                </nav>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openGlobalKeyModal()"
                    class="w-9 h-9 flex items-center justify-center text-slate-500 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors"
                    title="공통 API 설정">
                    ⚙️
                </button>
            </div>
        </div>
    </header>

    <!-- ═══════════ 메인 컨테이너 (1단 Full-Width 구성) ═══════════ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

        <!-- ===================================================================== -->
        <!-- [탭 1] 현황판 (1단 구성: 상단 요약·팀 카드 + 지시 입력바 + 전체폭 과제 테이블) -->
        <!-- ===================================================================== -->
        <div id="view-dashboard" class="space-y-5">

            <!-- 상단 요약 & 팀 현황 카드 -->
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-9 gap-3">
                <!-- 작업 카운트 3개 -->
                <div onclick="setTaskFilter('all')" class="bg-white rounded-xl p-3.5 border border-border shadow-sm cursor-pointer hover:border-blue-400 transition-all">
                    <div class="text-xs font-bold text-muted">전체 과제</div>
                    <div id="statTotalTasks" class="text-2xl font-extrabold text-primary mt-1">4</div>
                </div>
                <div onclick="setTaskFilter('pending')" class="bg-amber-50/70 rounded-xl p-3.5 border border-amber-200 shadow-sm cursor-pointer hover:border-amber-400 transition-all">
                    <div class="text-xs font-bold text-amber-800">결재 대기</div>
                    <div id="statPendingTasks" class="text-2xl font-extrabold text-amber-600 mt-1">2</div>
                </div>
                <div onclick="setTaskFilter('approved')" class="bg-emerald-50/70 rounded-xl p-3.5 border border-emerald-200 shadow-sm cursor-pointer hover:border-emerald-400 transition-all">
                    <div class="text-xs font-bold text-emerald-800">결재 완료</div>
                    <div id="statApprovedTasks" class="text-2xl font-extrabold text-emerald-600 mt-1">2</div>
                </div>

                <!-- 6개 팀 상태 카드 (클릭 시 해당 팀 집무실로 이동) -->
                <div id="topTeamCards" class="col-span-2 sm:col-span-4 lg:col-span-6 grid grid-cols-3 sm:grid-cols-6 gap-2">
                    <!-- JS 렌더링 -->
                </div>
            </div>

            <!-- 새 과업 지시 바 -->
            <div class="bg-white rounded-xl border border-border p-3.5 shadow-sm flex flex-col sm:flex-row gap-2.5">
                <input id="newTaskInput" type="text"
                    placeholder="새 과업 주제를 입력하세요..."
                    class="flex-1 px-4 py-2.5 rounded-xl border border-border text-sm font-medium focus:ring-2 focus:ring-accent focus:border-accent outline-none bg-slate-50/60 focus:bg-white"
                    onkeydown="if(event.key==='Enter') openRoutingModal()" />
                <button onclick="openRoutingModal()"
                    class="px-5 py-2.5 bg-accent hover:bg-blue-700 text-white font-bold text-sm rounded-xl transition-colors whitespace-nowrap">
                    + 과업 지시
                </button>
            </div>

            <!-- 1단 전체 폭 지시 과제 테이블 -->
            <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                <!-- 필터 바 -->
                <div class="px-5 py-3.5 border-b border-border flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <button onclick="setTaskFilter('all')" id="filterChip-all"
                            class="px-3 py-1 rounded-lg text-xs font-bold bg-accent text-white">전체</button>
                        <button onclick="setTaskFilter('pending')" id="filterChip-pending"
                            class="px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100">결재대기</button>
                        <button onclick="setTaskFilter('approved')" id="filterChip-approved"
                            class="px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100">결재완료</button>
                    </div>
                </div>

                <!-- 테이블 -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-border text-xs font-bold text-muted uppercase bg-slate-50/60">
                                <th class="py-3.5 px-5 w-28">상태</th>
                                <th class="py-3.5 px-4 w-32">일자</th>
                                <th class="py-3.5 px-4">지시 과업</th>
                                <th class="py-3.5 px-5 w-72">산출물</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardTableBody" class="divide-y divide-border text-sm">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===================================================================== -->
        <!-- [탭 2] 팀 집무실 (1단 구성: 상단 팀 선택 헤더 + 우측 [⚙️ 팀 설정] 버튼 + 1단 작업 테이블) -->
        <!-- ===================================================================== -->
        <div id="view-rooms" class="hidden space-y-5">

            <!-- 상단 팀 선택 & 설정 버튼 바 -->
            <div class="bg-white rounded-xl p-4 border border-border shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="selectRoom('secretary')" id="roomBtn-secretary" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">비서실장</button>
                    <button onclick="selectRoom('research')" id="roomBtn-research" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">리서치팀</button>
                    <button onclick="selectRoom('planning')" id="roomBtn-planning" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">기획팀</button>
                    <button onclick="selectRoom('audit')" id="roomBtn-audit" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">감사팀</button>
                    <button onclick="selectRoom('operations')" id="roomBtn-operations" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">운영팀</button>
                    <button onclick="selectRoom('media')" id="roomBtn-media" class="px-4 py-2 rounded-xl text-sm font-bold transition-all">미디어팀</button>
                </div>

                <button onclick="openTeamSettingsModal()"
                    class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold flex items-center gap-2 transition-colors">
                    <span>⚙️ 지침 · API · 데이터셋 설정</span>
                </button>
            </div>

            <!-- 현재 팀 요약 헤더 카드 (1단) -->
            <div class="bg-white rounded-xl p-5 border border-border shadow-sm space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-3">
                        <h2 id="roomHeaderName" class="text-lg font-extrabold text-primary"></h2>
                        <span id="roomHeaderModel" class="px-3 py-1 rounded-lg bg-blue-50 text-accent text-xs font-bold"></span>
                    </div>
                    <div id="roomHeaderDatasets" class="flex flex-wrap gap-1.5"></div>
                </div>
                <p id="roomHeaderSubtitle" class="text-sm text-slate-600"></p>
            </div>

            <!-- 해당 팀 작업 내역 테이블 (1단 전체 폭) -->
            <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                <div class="px-5 py-3.5 border-b border-border">
                    <h3 class="text-sm font-extrabold text-primary">수행 작업 및 팀 산출물 내역</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-border text-xs font-bold text-muted bg-slate-50/60">
                                <th class="py-3.5 px-5 w-28">일자</th>
                                <th class="py-3.5 px-4 w-56">과업명</th>
                                <th class="py-3.5 px-4 w-28 text-center">투입 단계</th>
                                <th class="py-3.5 px-5">이 팀의 처리 결과 요약</th>
                            </tr>
                        </thead>
                        <tbody id="roomTasksTableBody" class="divide-y divide-border text-sm">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===================================================================== -->
        <!-- [탭 3] 히스토리 (1단 구성: 검색·필터 헤더 + 전체 과제 테이블 ➔ 클릭 시 단계별 상세 모달) -->
        <!-- ===================================================================== -->
        <div id="view-archive" class="hidden space-y-5">

            <!-- 상단 검색 바 -->
            <div class="bg-white rounded-xl p-4 border border-border shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-extrabold text-primary">누적 과제 히스토리</span>
                    <span id="archiveTotalBadge" class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs font-bold"></span>
                </div>
                <input id="archiveSearchInput" type="text" placeholder="과업명 검색..."
                    oninput="renderArchiveView()"
                    class="w-64 px-3.5 py-2 rounded-xl border border-border text-sm outline-none focus:ring-2 focus:ring-accent" />
            </div>

            <!-- 1단 히스토리 테이블 -->
            <div class="bg-white rounded-xl border border-border shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-border text-xs font-bold text-muted bg-slate-50/60">
                                <th class="py-3.5 px-5 w-24">번호</th>
                                <th class="py-3.5 px-4 w-32">일자</th>
                                <th class="py-3.5 px-4 w-32">유형</th>
                                <th class="py-3.5 px-4">지시 과업</th>
                                <th class="py-3.5 px-4 w-64">산출물</th>
                                <th class="py-3.5 px-5 w-28 text-center">상태</th>
                            </tr>
                        </thead>
                        <tbody id="archiveTableBody" class="divide-y divide-border text-sm">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- ========================================================================= -->
    <!-- [모달 1] 과제 상세 · 산출물 · 단계별 처리 모달 (테이블 행 클릭 시 팝업) -->
    <!-- ========================================================================= -->
    <div id="taskDetailModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="modal-box bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-border overflow-hidden">

            <!-- 모달 상단 헤더 -->
            <div class="px-6 py-4 border-b border-border flex flex-wrap items-center justify-between gap-3 bg-slate-50 no-print">
                <div class="flex items-center gap-2.5 min-w-0">
                    <span id="modalTaskStatus" class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0"></span>
                    <h2 id="modalTaskTitle" class="text-base sm:text-lg font-extrabold text-primary truncate"></h2>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button id="modalApproveBtn" onclick="approveModalTask()"
                        class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition-colors">
                        결재 승인
                    </button>
                    <button onclick="copyModalContent()"
                        class="px-3 py-1.5 rounded-xl bg-white border border-border hover:bg-slate-100 text-slate-700 text-xs font-bold">
                        복사
                    </button>
                    <button onclick="window.print()"
                        class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">
                        인쇄
                    </button>
                    <button onclick="closeTaskDetailModal()"
                        class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-500 font-bold">
                        ✕
                    </button>
                </div>
            </div>

            <!-- 모달 서브탭 바: [산출물 탭들] + [단계별 처리과정 탭] -->
            <div class="px-6 py-2.5 border-b border-border flex flex-wrap items-center justify-between gap-2 bg-white no-print">
                <div id="modalSubTabs" class="flex flex-wrap gap-1.5">
                    <!-- JS 렌더링: 보고서 | 요약서 | 대조표 | ... | 단계별 과정 -->
                </div>
                <span id="modalTaskDate" class="text-xs text-muted"></span>
            </div>

            <!-- 모달 본문 영역 -->
            <div id="modalBodyContent" class="p-6 sm:p-8 overflow-y-auto flex-1 doc-viewer">
                <!-- JS 렌더링 -->
            </div>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- [모달 2] 새 과업 지시 · 비서실장 프로세스 편성 모달 -->
    <!-- ========================================================================= -->
    <div id="routingModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-border space-y-5">
            <div class="flex items-center justify-between border-b border-border pb-3">
                <h3 class="text-base font-extrabold text-primary">비서실장 프로세스 · 산출물 편성</h3>
                <button onclick="closeRoutingModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
            </div>

            <div>
                <div class="text-xs font-bold text-muted mb-1">지시 과업</div>
                <div id="routingModalTopic" class="text-base font-extrabold text-primary"></div>
            </div>

            <!-- 참여 팀 선택 -->
            <div class="space-y-2">
                <div class="text-xs font-bold text-slate-700">1. 투입 팀 및 순서 (클릭하여 변경)</div>
                <div id="routingTeamButtons" class="flex flex-wrap gap-2"></div>
                <div id="routingSequenceText" class="text-xs font-bold text-accent pt-1"></div>
            </div>

            <!-- 산출물 선택 -->
            <div class="space-y-2">
                <div class="text-xs font-bold text-slate-700">2. 생성할 산출물 (클릭하여 변경)</div>
                <div id="routingDelivButtons" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-border">
                <button onclick="closeRoutingModal()"
                    class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-bold">취소</button>
                <button onclick="confirmAndRunTask()"
                    class="px-5 py-2 rounded-xl bg-accent hover:bg-blue-700 text-white text-sm font-bold">실행</button>
            </div>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- [모달 3] 팀별 설정 모달 (역할·업무지침 / API·모델 / 참고 데이터셋) -->
    <!-- ========================================================================= -->
    <div id="teamSettingsModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-border overflow-hidden">
            <div class="px-6 py-4 border-b border-border flex items-center justify-between bg-slate-50">
                <h3 id="settingsModalTitle" class="text-base font-extrabold text-primary">팀 설정</h3>
                <button onclick="closeTeamSettingsModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
            </div>

            <div class="p-6 overflow-y-auto space-y-5 text-sm">
                <!-- 1. API 및 모델 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">API 공급자</label>
                        <select id="cfgApiProvider" class="w-full px-3 py-2 rounded-xl border border-border font-semibold bg-slate-50 outline-none">
                            <option value="Google Gemini API">Google Gemini API</option>
                            <option value="Anthropic Claude API">Anthropic Claude API</option>
                            <option value="OpenAI / OpenRouter">OpenAI / OpenRouter</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">AI 모델</label>
                        <select id="cfgModel" class="w-full px-3 py-2 rounded-xl border border-border font-semibold bg-slate-50 outline-none">
                            <option value="claude-opus-5.5">claude-opus-5.5</option>
                            <option value="gemini-4-argon">gemini-4-argon</option>
                            <option value="gpt-6-astra">gpt-6-astra</option>
                            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
                            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">팀 전용 API Key (선택)</label>
                    <input id="cfgCustomKey" type="password" placeholder="미입력 시 공통 API 키 사용"
                        class="w-full px-3.5 py-2 rounded-xl border border-border text-sm outline-none" />
                </div>

                <!-- 2. 참고 데이터셋 선택 및 추가 -->

                return {
                    category: '감사 대응',
                    teamSequence: ['research', 'audit', 'operations', 'secretary'],
                    deliverableKeys: ['audit_qna', 'risk_fact_sheet', 'onepager']

            if (t.includes('창구') || t.includes('대기시간') || t.includes('간소화') || t.includes('스크래핑') || t.includes('절차') || t.includes('패스트트랙')) {

                    teamSequence: ['research', 'operations', 'audit', 'secretary', 'media'],
                    deliverableKeys: ['official_report', 'process_asis_tobe', 'branch_notice']

            if (t.includes('동향') || t.includes('브리핑') || t.includes('언론') || t.includes('뉴스')) {

                deliverableKeys: ['official_report', 'onepager', 'diff_table', 'pt_press']

                    </button>

                    : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 whitespace-nowrap">결재완료</span>`;

                    const meta = DELIVERABLE_CATALOG[k] || { label: k, icon: '📄', btnClass: 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200' };
                    return `
                        <button type="button"
                            onclick="event.stopPropagation(); openTaskDetailModal('${t.id}', '${k}')"
                            title="${meta.label} 보기"
                            class="px-2.5 py-1.5 border rounded-lg text-xs font-bold transition-colors flex items-center gap-1 whitespace-nowrap ${meta.btnClass}">
                            <span>${meta.icon}</span>
                            <span>${meta.label}</span>

                    <tr onclick="openTaskDetailModal('${t.id}')" class="row-hover cursor-pointer transition-colors">
                        <td class="py-4 px-5 whitespace-nowrap">${statusBadge}</td>
                        <td class="py-4 px-4 text-slate-500 font-medium whitespace-nowrap">${t.date}</td>
                        <td class="py-4 px-4 font-bold text-primary text-base">${t.topic}</td>
                        <td class="py-4 px-5 whitespace-nowrap"><div class="flex flex-wrap items-center gap-1.5">${delivButtons}</div></td>
                    </tr>
                `;
            }).join('');
        }

        function setTaskFilter(filterKey) {
            currentTaskFilter = filterKey;
            ['all', 'pending', 'approved'].forEach(k => {
                const btn = document.getElementById('filterChip-' + k);
                btn.className = (k === filterKey)
                    ? 'px-3 py-1 rounded-lg text-xs font-bold bg-accent text-white'
                    : 'px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100';
            });
            renderDashboard();
        }

        // ═══════════ [모달 1] 과제 산출물 & 진행과정 모달 ═══════════
        function openTaskDetailModal(taskId, initialTab) {
            activeModalTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            activeModalTab = initialTab || task.deliverableKeys[0];
            renderTaskDetailModal();

            const modal = document.getElementById('taskDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeTaskDetailModal() {
            const modal = document.getElementById('taskDetailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderTaskDetailModal() {
            const task = tasks.find(t => t.id === activeModalTaskId);
            if (!task) return;

            document.getElementById('modalTaskTitle').textContent = task.topic;
            document.getElementById('modalTaskDate').textContent = `${task.date} · ${task.category}`;

            const stBadge = document.getElementById('modalTaskStatus');
            const appBtn = document.getElementById('modalApproveBtn');
            if (task.status === 'pending') {
                stBadge.textContent = '결재대기';
                stBadge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800';
                appBtn.classList.remove('hidden');
            } else {
                stBadge.textContent = '결재완료';
                stBadge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800';
                appBtn.classList.add('hidden');
            }

            // 서브탭: 맞춤형 산출물 탭들 + [진행과정] 탭
            const subTabsEl = document.getElementById('modalSubTabs');
            const docTabsHtml = task.deliverableKeys.map(k => {
                const active = activeModalTab === k;
                const meta = DELIVERABLE_CATALOG[k] || { label: k, icon: '📄' };
                return `
                    <button onclick="switchModalTab('${k}')"
                        class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${active ? 'bg-accent text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                        <span>${meta.icon}</span>
                        <span>${meta.label}</span>
                    </button>
                `;
            }).join('');

            const isStepsActive = activeModalTab === 'steps';
            const stepsTabHtml = `
                <button onclick="switchModalTab('steps')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${isStepsActive ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                    진행과정 (${task.teamSequence.length}단계)
                </button>
            `;

            subTabsEl.innerHTML = docTabsHtml + stepsTabHtml;

            const bodyEl = document.getElementById('modalBodyContent');
            if (activeModalTab === 'steps') {
                bodyEl.innerHTML = buildStepsHtml(task);
            } else {
                const docs = buildDeliverablesHtml(task);
                bodyEl.innerHTML = docs[activeModalTab] || '';
            }
        }

        function switchModalTab(tabKey) {
            activeModalTab = tabKey;
            renderTaskDetailModal();
        }

        function approveModalTask() {
            const task = tasks.find(t => t.id === activeModalTaskId);
            if (!task) return;
            task.status = 'approved';
            saveTasks();
            renderTaskDetailModal();
            if (currentMainView === 'dashboard') renderDashboard();
            if (currentMainView === 'archive') renderArchiveView();
        }

        function copyModalContent() {
            const text = document.getElementById('modalBodyContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('복사되었습니다.');
            });
        }

        // ═══════════ [모달 2] 새 과업 지시 · 비서실장 편성 모달 ═══════════
        function openRoutingModal() {
            const input = document.getElementById('newTaskInput');
            const topic = input.value.trim();
            if (!topic) {
                alert('과업 주제를 입력해 주세요.');
                return;
            }
            draftPlan = analyzeTopicByChiefSecretary(topic);
            draftPlan.topic = topic;

            document.getElementById('routingModalTopic').textContent = topic;
            renderRoutingModalControls();

            const modal = document.getElementById('routingModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeRoutingModal() {
            const modal = document.getElementById('routingModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderRoutingModalControls() {
            const allTeams = ['research', 'planning', 'audit', 'operations', 'secretary', 'media'];
            document.getElementById('routingTeamButtons').innerHTML = allTeams.map(k => {
                const active = draftPlan.teamSequence.includes(k);
                return `
                    <button type="button" onclick="toggleDraftTeam('${k}')"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${active ? 'bg-accent text-white border-accent' : 'bg-slate-50 text-slate-500 border-border'}">
                        ${teamConfigs[k].name}
                    </button>
                `;
            }).join('');

            const seqStr = draftPlan.teamSequence.map((k, i) => `${i + 1}. ${teamConfigs[k].name}`).join(' → ');
            document.getElementById('routingSequenceText').textContent = `순서: ${seqStr}`;

            document.getElementById('routingDelivButtons').innerHTML = Object.values(DELIVERABLE_CATALOG).map(d => {
                const active = draftPlan.deliverableKeys.includes(d.key);
                return `
                    <button type="button" onclick="toggleDraftDeliv('${d.key}')"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center gap-1.5 ${active ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-500 border-border'}">
                        <span>${d.icon}</span>
                        <span>${d.label}</span>
                    </button>
                `;
            }).join('');
        }

        function toggleDraftTeam(k) {
            const idx = draftPlan.teamSequence.indexOf(k);
            if (idx >= 0) {
                if (draftPlan.teamSequence.length <= 1) return;
                draftPlan.teamSequence.splice(idx, 1);
            } else {
                draftPlan.teamSequence.push(k);
            }
            renderRoutingModalControls();
        }

        function toggleDraftDeliv(k) {
            const idx = draftPlan.deliverableKeys.indexOf(k);
            if (idx >= 0) {
                if (draftPlan.deliverableKeys.length <= 1) return;
                draftPlan.deliverableKeys.splice(idx, 1);
            } else {
                draftPlan.deliverableKeys.push(k);
            }
            renderRoutingModalControls();
        }

        function confirmAndRunTask() {
            if (!draftPlan) return;
            const nextNum = String(tasks.length + 1).padStart(2, '0');
            const today = new Date().toISOString().slice(0, 10);
            const newTask = createTaskRecord(`2026-${nextNum}`, today, draftPlan.topic, 'pending', draftPlan);
            tasks.unshift(newTask);
            saveTasks();

            document.getElementById('newTaskInput').value = '';
            closeRoutingModal();
            setTaskFilter('all');
            renderDashboard();
            openTaskDetailModal(newTask.id);
        }

        // ═══════════ [탭 2] 팀 집무실 (1단 구성 + 설정 모달) ═══════════
        function goToTeamRoom(roomKey) {
            currentRoomKey = roomKey;
            switchMainView('rooms');
        }

        function selectRoom(roomKey) {
            currentRoomKey = roomKey;
            renderRoomsView();
        }

        function renderRoomsView() {
            ['secretary', 'research', 'planning', 'audit', 'operations', 'media'].forEach(k => {
                const btn = document.getElementById('roomBtn-' + k);
                btn.className = (k === currentRoomKey)
                    ? 'px-4 py-2 rounded-xl text-sm font-bold transition-all bg-accent text-white'
                    : 'px-4 py-2 rounded-xl text-sm font-bold transition-all text-slate-600 hover:bg-slate-100';
            });

            const cfg = teamConfigs[currentRoomKey];
            document.getElementById('roomHeaderName').textContent = cfg.name;
            document.getElementById('roomHeaderModel').textContent = `${cfg.apiProvider} · ${cfg.model}`;
            document.getElementById('roomHeaderSubtitle').textContent = cfg.subtitle;

            const dsNames = datasets.filter(d => cfg.datasetIds.includes(d.id)).map(d => `
                <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold">${d.name}</span>
            `).join('');
            document.getElementById('roomHeaderDatasets').innerHTML = dsNames;

            // 이 팀이 참여한 과제 내역 1단 테이블
            const tbody = document.getElementById('roomTasksTableBody');
            tbody.innerHTML = tasks.map(t => {
                const stepIdx = t.teamSequence.indexOf(currentRoomKey);
                const stepBadge = stepIdx >= 0
                    ? `<span class="px-2.5 py-1 rounded-lg bg-blue-50 text-accent text-xs font-bold">${stepIdx + 1}단계 투입</span>`
                    : `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-400 text-xs font-semibold">미투입</span>`;
                const summary = stepIdx >= 0 ? (t.teamSummaries[currentRoomKey] || '') : '해당 과업 유형에서는 생략됨';

                return `
                    <tr onclick="openTaskDetailModal('${t.id}', 'steps')" class="row-hover cursor-pointer transition-colors">
                        <td class="py-4 px-5 text-slate-500">${t.date}</td>
                        <td class="py-4 px-4 font-bold text-primary">${t.topic}</td>
                        <td class="py-4 px-4 text-center">${stepBadge}</td>
                        <td class="py-4 px-5 text-slate-700">${summary}</td>
                    </tr>
                `;
            }).join('');
        }

        // 팀 설정 모달 열기/저장
        function openTeamSettingsModal() {
            const cfg = teamConfigs[currentRoomKey];
            document.getElementById('settingsModalTitle').textContent = `${cfg.name} 설정`;
            document.getElementById('cfgApiProvider').value = cfg.apiProvider;
            document.getElementById('cfgModel').value = cfg.model;
            document.getElementById('cfgCustomKey').value = cfg.customKey || '';
            document.getElementById('cfgSubtitle').value = cfg.subtitle;
            document.getElementById('cfgGuidelines').value = cfg.guidelines;

            renderModalDatasetCheckboxes();

            const modal = document.getElementById('teamSettingsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function renderModalDatasetCheckboxes() {
            const cfg = teamConfigs[currentRoomKey];
            document.getElementById('cfgDatasetList').innerHTML = datasets.map(ds => {
                const checked = cfg.datasetIds.includes(ds.id);
                return `
                    <label class="flex items-center justify-between p-3 rounded-xl border cursor-pointer ${checked ? 'bg-blue-50/50 border-blue-300' : 'bg-slate-50 border-border'}">
                        <div class="flex items-center gap-2.5">
                            <input type="checkbox" class="w-4 h-4 accent-blue-600" ${checked ? 'checked' : ''}
                                onchange="toggleDatasetInModal('${ds.id}')" />
                            <div>
                                <div class="text-sm font-bold text-primary">${ds.name}</div>
                                <div class="text-xs text-muted">${ds.desc}</div>
                            </div>
                        </div>
                    </label>
                `;
            }).join('');
        }

        function toggleDatasetInModal(dsId) {
            const cfg = teamConfigs[currentRoomKey];
            const idx = cfg.datasetIds.indexOf(dsId);
            if (idx >= 0) cfg.datasetIds.splice(idx, 1);
            else cfg.datasetIds.push(dsId);
            renderModalDatasetCheckboxes();
        }

        function addDatasetInModal() {
            const nameEl = document.getElementById('newDsName');
            const urlEl = document.getElementById('newDsUrl');
            const name = nameEl.value.trim();
            if (!name) return;
            const newId = 'ds_' + Date.now();
            datasets.push({ id: newId, name, desc: urlEl.value.trim() || '사용자 추가 데이터셋' });
            teamConfigs[currentRoomKey].datasetIds.push(newId);
            nameEl.value = '';
            urlEl.value = '';
            renderModalDatasetCheckboxes();
        }

        function saveTeamSettingsFromModal() {
            const cfg = teamConfigs[currentRoomKey];
            cfg.apiProvider = document.getElementById('cfgApiProvider').value;
            cfg.model = document.getElementById('cfgModel').value;
            cfg.customKey = document.getElementById('cfgCustomKey').value.trim();
            cfg.subtitle = document.getElementById('cfgSubtitle').value.trim();
            cfg.guidelines = document.getElementById('cfgGuidelines').value;
            saveTeamConfigs();
            closeTeamSettingsModal();
            renderRoomsView();
        }

        function resetCurrentTeamConfig() {
            teamConfigs[currentRoomKey] = JSON.parse(JSON.stringify(DEFAULT_TEAM_CONFIGS[currentRoomKey]));
            saveTeamConfigs();
            openTeamSettingsModal();
            renderRoomsView();
        }

        function closeTeamSettingsModal() {
            const modal = document.getElementById('teamSettingsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ═══════════ [탭 3] 히스토리 (1단 전체 폭 테이블) ═══════════
        function renderArchiveView() {
            const q = (document.getElementById('archiveSearchInput')?.value || '').trim().toLowerCase();
            const filtered = tasks.filter(t => !q || t.topic.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
            document.getElementById('archiveTotalBadge').textContent = `${filtered.length}건`;

            document.getElementById('archiveTableBody').innerHTML = filtered.map(t => {
                const statusBadge = t.status === 'pending'
                    ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 whitespace-nowrap">결재대기</span>`
                    : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 whitespace-nowrap">결재완료</span>`;

                    return `

                            <span>${meta.icon}</span>

            }).join('');
